# CI: executa os MESMOS comandos documentados no README (regra .claude/rules/entrega.md).
#
#   lint ──► test
#   data           (dataset real da UCI: SHA256, pipeline e relatorios reproduzidos)
#   commitlint     (so em pull request)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  TC04_LOG_FORMAT: json
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # --locked falha se o uv.lock estiver dessincronizado do pyproject.toml.
      - name: Instalar dependencias
        run: uv sync --group dev --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff nos notebooks
        run: uv run nbqa ruff notebooks/

  test:
    name: Testes
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --group dev --locked

      - name: Gerar dataset sintetico
        run: uv run python scripts/download_data.py --synthetic --rows 10000

      - name: Preparar referencia e producao (sintetico)
        run: uv run python scripts/prepare_data.py --synthetic

      - name: Treinar e promover o modelo (sintetico)
        run: uv run python scripts/train_model.py

      - name: Contrato - lote valido aprovado (sintetico)
        run: uv run python scripts/validate_batch.py --demo valid

      # O lote corrompido PRECISA ser bloqueado: exit 2. Qualquer outro codigo falha o job.
      - name: Contrato - lote corrompido bloqueado (sintetico)
        shell: bash
        run: |
          set +e
          uv run python scripts/validate_batch.py --demo corrupted
          code=$?
          echo "exit code: $code"
          test "$code" -eq 2

      - name: pytest
        run: uv run pytest --cov=src --cov-report=term-missing

  data:
    name: Dataset real (UCI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --group dev --locked

      # Mesmos comandos do README: prova que um clone limpo obtem o dado real sem conta.
      - name: Baixar dataset
        run: uv run python scripts/download_data.py

      - name: Verificar ambiente
        run: uv run python scripts/verify_setup.py

      - name: Preparar referencia e producao (dataset real)
        run: uv run python scripts/prepare_data.py

      - name: Treinar e promover o modelo (dataset real)
        run: uv run python scripts/train_model.py

      - name: Contrato - lote valido aprovado (dataset real)
        run: uv run python scripts/validate_batch.py --demo valid

      # O lote corrompido PRECISA ser bloqueado: exit 2. Qualquer outro codigo falha o job.
      - name: Contrato - lote corrompido bloqueado (dataset real)
        shell: bash
        run: |
          set +e
          uv run python scripts/validate_batch.py --demo corrupted
          code=$?
          echo "exit code: $code"
          test "$code" -eq 2

      # Evidencia versionada precisa ser reproduzida byte a byte num clone limpo.
      - name: Relatorios versionados reproduzidos
        run: git diff --exit-code reports/

  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validar mensagens do PR
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
