# Configuracao central do pipeline. Limiares e parametros vivem aqui, nunca no codigo.
# Documentacao: docs/DATASET.md, docs/DATA_CONTRACTS.md, docs/DRIFT.md, docs/MONITORING.md

seed: 42
monitoring:
  thresholds:
    psi_warning: 0.10
    psi_critical: 0.25
    score_psi_warning: 0.10
    auc_drop_critical: 0.05

dataset:
  name: uci_default_of_credit_card_clients
  uci_id: 350
  url: https://archive.ics.uci.edu/static/public/350/data.csv
  # SHA256 do arquivo oficial, conferido em 2026-11-07. Se nao bater, o download falha.
  sha256: 45bcf4df62ff2e237a74eb155cabfb4bbbc171219a0637daef44fdad07503dd0
  raw_file: uci_350_data.csv
  synthetic_file: synthetic_350_data.csv
  expected_rows: 30000
  license: CC BY 4.0
  attribution: >-
    Yeh, I. (2009). Default of Credit Card Clients [Dataset].
    UCI Machine Learning Repository. https://doi.org/10.24432/C55S3H

cleaning:
  # Aplicada SO na referencia, antes do split. Em producao o contrato rejeita esses codigos.
  # Evidencias: notebooks/01_eda.ipynb
  education_other_codes: [0, 5, 6]   # fora do dicionario; inadimplencia proxima do codigo 4
  education_other_value: 4
  marriage_other_codes: [0]          # fora do dicionario
  marriage_other_value: 3
  # 35 pares de linhas identicas (23 features + target) com IDs diferentes: nao da para
  # distinguir cadastro duplicado de coincidencia; remover a copia custa 0,12% das linhas.
  drop_duplicate_profiles: true

split:
  production_fraction: 0.5   # pool de producao, fonte dos lotes simulados
  validation_fraction: 0.15  # da referencia
  test_fraction: 0.15        # da referencia
  max_default_rate_gap_pp: 1.0

contract:
  # docs/DATA_CONTRACTS.md. Regras C* bloqueiam o lote; avisos W* so registram.
  # Dominios conferidos na referencia real (notebooks/01_eda.ipynb).
  age_range: [18, 100]          # C4
  limit_bal_max: 1000000        # C5 (LIMIT_BAL > 0 e <= max)
  education_codes: [1, 2, 3, 4] # C6
  sex_codes: [1, 2]             # C6
  marriage_codes: [1, 2, 3]     # C6
  pay_status_range: [-2, 9]     # C7
  warnings:
    bill_amt_min: -100000       # W1: fatura negativa abaixo disso (2 linhas na referencia)
    volume_tolerance: 0.30      # W2: lote fora de +-30% de batches.rows
    late_payment_ratio_max: 1.5 # W3: fracao de PAY_0 >= 2 acima de 1,5x a da referencia

batches:
  rows: 2400                    # tamanho de cada lote simulado (M01..M06)
  corrupted:
    # Lote da demonstracao de bloqueio: amostra VALIDA do pool + defeitos declarados.
    rows: 500
    rows_per_defect: 5
    invalid_ages: [15, 130]     # C4
    invalid_education: 7        # C6
    extra_column: CPF           # C1 (valor ficticio fixo, nunca um CPF real)

model:
  # ADR 04: comparacao enxuta, parametros padrao, criterio declarado antes do treino.
  # Fora das features: chave, target, atributos so de auditoria (ADR 08) e os atributos
  # pessoais removidos pela ablacao (ADR 13: sem AGE e EDUCATION a AUC val. nao cai).
  excluded_columns: [ID, default, SEX, MARRIAGE, AGE, EDUCATION]
  categorical_columns: [EDUCATION]  # usado so se EDUCATION voltar a ser feature
  candidates: [dummy, logistic_regression, xgboost]
  interpretable: logistic_regression
  promotion:
    min_auc: 0.70          # na validacao; o teste so reporta
    tie_tolerance: 0.01    # empate tecnico -> o mais interpretavel

ablation:
  # ADR 13 - criterio declarado ANTES de rodar a ablacao (minimizacao, LGPD art. 6, III):
  # um atributo pessoal so fica no modelo se pagar por si. Remove-se o conjunto inteiro se
  # a variante sem ele perder menos que max_auc_loss de AUC na validacao (modelo promovido
  # pelo criterio do ADR 04 em cada variante). Senao, cada atributo e avaliado sozinho
  # com o mesmo limiar. A decisao e aplicada em model.excluded_columns.
  candidates: [AGE, EDUCATION]
  max_auc_loss: 0.01        # mesma tolerancia do empate tecnico do ADR 04

fairness:
  # Auditoria de vies (ADR 08/13): resultado por grupo, medido no teste da referencia.
  # Os atributos ficam nos dados para a auditoria mesmo quando nao sao features.
  attributes: [SEX, AGE, EDUCATION, MARRIAGE]
  age_bins: [18, 30, 40, 50, 101]   # 18-29, 30-39, 40-49, 50+
  impact_ratio_min: 0.8             # regra dos 4/5
  min_group_size: 100               # abaixo disso: numero reportado, sem conclusao

synthetic:
  # Fallback para quem nao conseguir baixar o dataset real e para o CI.
  # Valida o pipeline; NAO reproduz as metricas documentadas.
  default_rows: 30000
