[project]
name = "tc04-monitoramento-drift"
version = "0.1.0"
description = "Contratos de dados, deteccao de drift, observabilidade e governanca LGPD para um modelo de credit scoring."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "evidently>=0.7.23",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "pandas>=2.2,<3",
    "pandera>=0.35.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "structlog>=26.1.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "nbqa>=1.10.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20", "PTH"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
